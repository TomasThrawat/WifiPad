name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wifipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build and test debug APKs
        run: gradle :controller-app:testDebugUnitTest :controller-app:assembleDebug :receiver-app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: controller-app-debug
          path: controller-app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: receiver-app-debug
          path: receiver-app/build/outputs/apk/debug/*.apk
