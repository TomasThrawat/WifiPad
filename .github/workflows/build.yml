name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle :controller-app:assembleDebug :receiver-app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: controller-app-debug
          path: controller-app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: receiver-app-debug
          path: receiver-app/build/outputs/apk/debug/*.apk
