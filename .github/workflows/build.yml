name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wifipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"

      - name: Test controller and build optimized installable APKs
        run: gradle :controller-app:testDebugUnitTest :controller-app:assembleRelease :receiver-app:assembleRelease --stacktrace --warning-mode all

      - name: Report APK sizes
        run: |
          stat -c '%n %s bytes' controller-app/build/outputs/apk/release/*.apk receiver-app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: controller-app-release
          path: controller-app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: receiver-app-release
          path: receiver-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
