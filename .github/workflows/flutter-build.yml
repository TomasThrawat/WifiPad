name: Flutter WifiPad APKs

on:
  push:
    branches: [main, flutter-migration]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-build.yml'
      - 'receiver-app/src/main/java/com/wifipad/receiver/**'
      - 'receiver-app/src/main/aidl/com/wifipad/receiver/**'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-build.yml'
      - 'receiver-app/src/main/java/com/wifipad/receiver/**'
      - 'receiver-app/src/main/aidl/com/wifipad/receiver/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wifipad-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolds and inject TV receiver bridge
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --project-name wifipad_controller --org com.wifipad --platforms=android /tmp/wifipad_controller
          flutter create --project-name wifipad_receiver --org com.wifipad --platforms=android /tmp/wifipad_receiver
          cp flutter/controller/pubspec.yaml /tmp/wifipad_controller/pubspec.yaml
          cp -R flutter/controller/lib/. /tmp/wifipad_controller/lib/
          cp -R flutter/controller/test/. /tmp/wifipad_controller/test/
          cp flutter/controller/native/AndroidManifest.xml /tmp/wifipad_controller/android/app/src/main/AndroidManifest.xml
          cp flutter/receiver/pubspec.yaml /tmp/wifipad_receiver/pubspec.yaml
          cp -R flutter/receiver/lib/. /tmp/wifipad_receiver/lib/
          APP=/tmp/wifipad_receiver/android/app
          mkdir -p "$APP/src/main/kotlin/com/wifipad/wifipad_receiver" "$APP/src/main/aidl/com/wifipad/wifipad_receiver"
          cp flutter/receiver/native/MainActivity.kt "$APP/src/main/kotlin/com/wifipad/wifipad_receiver/MainActivity.kt"
          cp flutter/receiver/native/AndroidManifest.xml "$APP/src/main/AndroidManifest.xml"
          cp receiver-app/src/main/aidl/com/wifipad/receiver/IGamepadService.aidl "$APP/src/main/aidl/com/wifipad/wifipad_receiver/IGamepadService.aidl"
          cp receiver-app/src/main/java/com/wifipad/receiver/{GamepadUserService.kt,Protocol.kt,UinputGamepad.kt} "$APP/src/main/kotlin/com/wifipad/wifipad_receiver/"
          sed -i 's/package com\.wifipad\.receiver/package com.wifipad.wifipad_receiver/' "$APP/src/main/aidl/com/wifipad/wifipad_receiver/IGamepadService.aidl" "$APP/src/main/kotlin/com/wifipad/wifipad_receiver/"*.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wifipad_receiver/android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 30')
          s=s.replace('android {', 'android {\n    buildFeatures { aidl = true; buildConfig = true }', 1)
          s += '\n\ndependencies {\n    implementation("dev.rikka.shizuku:api:13.1.5")\n    implementation("dev.rikka.shizuku:provider:13.1.5")\n}\n'
          p.write_text(s)
          PY
      - name: Test controller packet protocol
        working-directory: /tmp/wifipad_controller
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Analyze and build controller APK (arm64-v8a)
        working-directory: /tmp/wifipad_controller
        run: |
          flutter build apk --debug --target-platform android-arm64
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/artifacts/wifipad-controller-arm64-debug.apk"
      - name: Analyze and build TV receiver APK (arm64-v8a)
        working-directory: /tmp/wifipad_receiver
        run: |
          flutter pub get
          dart format lib
          flutter analyze --no-pub
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/artifacts/wifipad-receiver-arm64-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WifiPad-Flutter-APKs-arm64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
