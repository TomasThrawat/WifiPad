version: 2.1

jobs:
  android-build:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Select JDK 17
          command: |
            test -d /usr/lib/jvm/java-17-openjdk-amd64
            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH' >> "$BASH_ENV"
            java -version

      - restore_cache:
          keys:
            - wifipad-gradle-native-v2-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - wifipad-gradle-native-v2-

      - run:
          name: Install pinned Gradle 9.3.1
          command: |
            if [ ! -x "$HOME/gradle-9.3.1/bin/gradle" ]; then
              curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-9.3.1-bin.zip --output /tmp/gradle-9.3.1-bin.zip
              unzip -q /tmp/gradle-9.3.1-bin.zip -d "$HOME"
            fi
            echo 'export PATH=$HOME/gradle-9.3.1/bin:$PATH' >> "$BASH_ENV"
            "$HOME/gradle-9.3.1/bin/gradle" --version

      - run:
          name: Verify Android SDK 37.0
          command: |
            set -euo pipefail
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            test -n "$SDK_ROOT"

            ANDROID_CLI="$SDK_ROOT/cmdline-tools/latest/bin/android"
            if [ ! -x "$ANDROID_CLI" ]; then
              ANDROID_CLI="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name android -perm -u+x -print -quit 2>/dev/null || true)"
            fi
            if [ -z "$ANDROID_CLI" ] || [ ! -x "$ANDROID_CLI" ]; then
              curl --fail --location --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/install.sh --output /tmp/install-android-cli.sh
              bash /tmp/install-android-cli.sh
              ANDROID_CLI="$(find "$HOME" -maxdepth 6 -type f -name android -perm -u+x -print -quit 2>/dev/null || true)"
            fi
            if [ -z "$ANDROID_CLI" ] || [ ! -x "$ANDROID_CLI" ]; then
              echo "Android CLI executable was not found after installation"
              exit 1
            fi
            echo "Android CLI: $ANDROID_CLI"
            "$ANDROID_CLI" --version
            "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk list --all --canary | tee /tmp/android-sdk-packages.txt
            echo "=== Android 17 and Build Tools 37 package entries ==="
            grep -Ei "platforms/android-37\.0|build-tools/37" /tmp/android-sdk-packages.txt || true

            set +o pipefail
            yes | "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install build-tools/36.0.0 ndk/28.2.13676358
            yes | "$ANDROID_CLI" --sdk="$SDK_ROOT" sdk install platforms/android-37.0
            set -o pipefail

            echo "export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> "$BASH_ENV"
            test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
            test -d "$SDK_ROOT/build-tools/36.0.0"
            test -d "$SDK_ROOT/ndk/28.2.13676358"

      - run:
          name: Prepare launcher icon silhouettes
          command: |
            python3 scripts/prepare_launcher_icons.py

      - run:
          name: Build phone controller APK
          command: |
            set -euxo pipefail
            if [ -e app ] && [ ! -L app ]; then
              echo "Refusing to replace a non-symlink app path"
              exit 1
            fi
            rm -f app
            ln -s controller-app app
            test -f app/build.gradle.kts
            grep -Fq "compileSdk = 37" controller-app/build.gradle.kts
            grep -Fq "targetSdk = 37" controller-app/build.gradle.kts
            grep -Fq "androidx.core:core-ktx:1.19.1" controller-app/build.gradle.kts
            echo "Controller SDK/dependency versions verified: API 37 / Core 1.19.1"
            echo "=== Controller unit tests ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:testDebugUnitTest 2>&1 | tee -a "$PWD/gradle-build.log"
            echo "=== Controller Android Lint ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:lintDebug 2>&1 | tee -a "$PWD/gradle-build.log"
            echo "=== Controller APK assembly ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee -a "$PWD/gradle-build.log"

      - run:
          name: Build TV receiver APK
          command: |
            set -euxo pipefail
            if [ -e app ] && [ ! -L app ]; then
              echo "Refusing to replace a non-symlink app path"
              exit 1
            fi
            rm -f app
            ln -s receiver-app app
            test -f app/build.gradle.kts
            grep -Fq "compileSdk = 37" receiver-app/build.gradle.kts
            grep -Fq "targetSdk = 37" receiver-app/build.gradle.kts
            grep -Fq "androidx.core:core-ktx:1.19.1" receiver-app/build.gradle.kts
            echo "Receiver SDK/dependency versions verified: API 37 / Core 1.19.1"
            grep -Fq 'abiFilters.add("armeabi-v7a")' receiver-app/build.gradle.kts
            grep -Fq 'abiFilters.add("arm64-v8a")' controller-app/build.gradle.kts
            echo "Receiver ABI filter verified: armeabi-v7a"
            echo "Controller ABI filter preserved: arm64-v8a"
            echo "=== Receiver unit tests ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:testDebugUnitTest 2>&1 | tee -a "$PWD/gradle-build.log"
            echo "=== Receiver Android Lint ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:lintDebug 2>&1 | tee -a "$PWD/gradle-build.log"
            echo "=== Receiver APK assembly ==="
            gradle --no-daemon --max-workers=1 --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee -a "$PWD/gradle-build.log"

      - run:
          name: Verify APKs contain no Flutter runtime
          command: |
            set -euo pipefail
            : > apk-audit.txt
            for apk in controller-app/build/outputs/apk/debug/app-debug.apk receiver-app/build/outputs/apk/debug/app-debug.apk; do
              test -s "$apk"
              unzip -t "$apk"
              if unzip -l "$apk" | grep -Ei 'libflutter\.so|libapp\.so|flutter_assets|kernel_blob\.bin|isolate_snapshot_data'; then
                echo "Flutter runtime payload detected in $apk" | tee -a apk-audit.txt
                exit 1
              fi
              echo "APK: $apk" | tee -a apk-audit.txt
              ls -lh "$apk" | tee -a apk-audit.txt
              sha256sum "$apk" | tee -a apk-audit.txt
              echo "Native libraries:" | tee -a apk-audit.txt
              unzip -l "$apk" | grep -E 'lib/(armeabi-v7a|arm64-v8a)/.*\.so' | tee -a apk-audit.txt || true
              echo | tee -a apk-audit.txt
            done

      - save_cache:
          key: wifipad-gradle-native-v2-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_test_results:
          path: controller-app/build/test-results

      - store_test_results:
          path: receiver-app/build/test-results

      - store_artifacts:
          path: gradle-build.log
          destination: diagnostics/gradle-build.log

      - store_artifacts:
          path: apk-audit.txt
          destination: diagnostics/apk-audit.txt

      - store_artifacts:
          path: controller-app/build/reports/lint-results-debug.html
          destination: diagnostics/controller-lint-results.html

      - store_artifacts:
          path: controller-app/build/reports/lint-results-debug.xml
          destination: diagnostics/controller-lint-results.xml

      - store_artifacts:
          path: receiver-app/build/reports/lint-results-debug.html
          destination: diagnostics/receiver-lint-results.html

      - store_artifacts:
          path: receiver-app/build/reports/lint-results-debug.xml
          destination: diagnostics/receiver-lint-results.xml

      - store_artifacts:
          path: controller-app/build/outputs/apk/debug
          destination: controller-app-native-debug-apk

      - store_artifacts:
          path: receiver-app/build/outputs/apk/debug
          destination: receiver-app-native-debug-apk

workflows:
  build-and-test:
    jobs:
      - android-build
