version: 2.1

jobs:
  android-build:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Install Flutter stable and bootstrap the module
          command: |
            set -euxo pipefail
            repo_root="$PWD"
            : > "$repo_root/flutter-bootstrap.log"
            : > "$repo_root/gradle-build.log"
            exec > >(tee -a "$repo_root/flutter-bootstrap.log") 2>&1

            if [ ! -x "$HOME/flutter/bin/flutter" ]; then
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
            fi

            export FLUTTER_ROOT="$HOME/flutter"
            export PATH="$FLUTTER_ROOT/bin:$PATH"
            echo 'export FLUTTER_ROOT=$HOME/flutter' >> "$BASH_ENV"
            echo 'export PATH=$HOME/flutter/bin:$PATH' >> "$BASH_ENV"
            command -v flutter
            flutter config --no-analytics
            flutter --version

            cd "$repo_root/flutter_ui"
            backup_dir="$HOME/wifipad-flutter-source-backup"
            rm -rf "$backup_dir"
            mkdir -p "$backup_dir"
            cp pubspec.yaml "$backup_dir/pubspec.yaml"
            cp -R lib "$backup_dir/lib"
            cp -R test "$backup_dir/test"
            flutter create --template=module --project-name=wifipad_ui --org=dev.wifipad --overwrite --no-pub .
            cp "$backup_dir/pubspec.yaml" pubspec.yaml
            rm -rf lib test
            cp -R "$backup_dir/lib" lib
            cp -R "$backup_dir/test" test
            flutter pub get
            flutter analyze --no-pub
            flutter test --no-pub

      - run:
          name: Select JDK 17
          command: |
            test -d /usr/lib/jvm/java-17-openjdk-amd64
            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH' >> "$BASH_ENV"
            java -version

      - restore_cache:
          keys:
            - wifipad-gradle-flutter-v2-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - wifipad-gradle-flutter-v2-

      - run:
          name: Install pinned Gradle 8.14.6
          command: |
            if [ ! -x "$HOME/gradle-8.14.6/bin/gradle" ]; then
              curl --fail --location --retry 3                 https://services.gradle.org/distributions/gradle-8.14.6-bin.zip                 --output /tmp/gradle-8.14.6-bin.zip
              unzip -q /tmp/gradle-8.14.6-bin.zip -d "$HOME"
            fi
            echo 'export PATH=$HOME/gradle-8.14.6/bin:$PATH' >> "$BASH_ENV"
            "$HOME/gradle-8.14.6/bin/gradle" --version

      - run:
          name: Verify Android SDK 35
          command: |
            command -v sdkmanager
            set +o pipefail
            yes | sdkmanager --licenses >/dev/null
            set -o pipefail
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
            test -d "$ANDROID_HOME/platforms/android-35" ||               test -d "$ANDROID_SDK_ROOT/platforms/android-35"
            test -d "$ANDROID_HOME/build-tools/35.0.0" ||               test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - run:
          name: Run unit tests, lint, and build both APKs
          command: |
            set -euxo pipefail
            gradle --no-daemon --stacktrace --warning-mode all \
              :controller-app:testDebugUnitTest \
              :receiver-app:testDebugUnitTest \
              :controller-app:lintDebug \
              :receiver-app:lintDebug \
              :controller-app:assembleDebug \
              :receiver-app:assembleDebug 2>&1 | tee "$PWD/gradle-build.log"

      - save_cache:
          key: wifipad-gradle-flutter-v2-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - ~/.pub-cache

      - store_test_results:
          path: controller-app/build/test-results

      - store_test_results:
          path: receiver-app/build/test-results

      - store_artifacts:
          path: flutter-bootstrap.log
          destination: diagnostics/flutter-bootstrap.log

      - store_artifacts:
          path: gradle-build.log
          destination: diagnostics/gradle-build.log

      - store_artifacts:
          path: controller-app/build/outputs/apk/debug
          destination: controller-app-debug-apk

      - store_artifacts:
          path: receiver-app/build/outputs/apk/debug
          destination: receiver-app-debug-apk

workflows:
  build-and-test:
    jobs:
      - android-build
